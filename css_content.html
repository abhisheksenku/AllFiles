<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    form{
      padding: 25px;
      background-color: sienna;
      border-radius: 40px;
    }
    /* form {
      font-family: Arial;
      background-color: aquamarine;
      padding: 50px;
      border-radius: 20px;
    } */

    label {
      font-weight: bold;
      font-size: 20px;
      color: teal;
    }

    input {
      font-style: italic;
      margin-bottom: 20px;
      height: 30px;
    }

    button {
      background-color: rgb(255, 196, 0);
      width: 225px;
      border: 1px solid rgb(17, 0, 255);
    }
  </style>
</head>

<body>
  <form>
    <label for="name">Name:</label>
    <input type="text" id="name">
    <br>
    <button type="submit">Submit</button>
  </form>
</body>

</html>
